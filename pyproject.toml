[tool.ruff]
line-length = 120
src = ["src", "third_party"]
extend-exclude = ["third_party", "venv", "user_data"]

[tool.ruff.lint]
select = ["F", "I", "N", "W", "E711", "E712", "E713", "E714", "E722"]
# N806 is ignored: local names such as minVal/maxLoc mirror OpenCV and the game.
ignore = ["N806"]
# Not enforced: E501 (line length). The formatter wraps code, the remaining long lines are strings and comments.
